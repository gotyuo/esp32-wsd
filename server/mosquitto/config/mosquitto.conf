# ============================================================
# Mosquitto MQTT Broker 配置
# 对外端口由 docker-compose 映射（默认 18830 -> 1883）
# 强制账号密码认证，禁止匿名
# ============================================================
listener 1883
protocol mqtt

allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

# 单设备小包场景，限制最大连接数与消息大小
max_queued_messages 1000
message_size_limit 65536
