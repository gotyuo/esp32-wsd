# ============================================================
# Mosquitto MQTT Broker 配置
# 对外端口由 docker-compose 映射（默认 18830 -> 1883）
# ============================================================
listener 1883
protocol mqtt

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

sys_interval 10

max_queued_messages 1000
message_size_limit 65536
