# ============================================================
# 物联网环境监测系统 - Docker Compose 部署
#
# 非常规端口设计（降低扫描风险）:
#   MQTT 对外 18830（设备接入）
#   Web  对外 8627 （管理仪表盘/API）
#   TTS  对内 10200（Piper 本地语音合成，不对外暴露）
# 可通过 .env 文件覆盖: MQTT_PORT / WEB_PORT / MQTT_USER / MQTT_PASS / ADMIN_TOKEN
# ============================================================
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: envmon-broker
    restart: unless-stopped
    user: root
    ports:
      - "${MQTT_PORT:-18830}:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
    environment:
      - MQTT_USER=${MQTT_USER:-envmon}
      - MQTT_PASS=${MQTT_PASS:-envmon}
    entrypoint: ["/bin/sh", "/mosquitto/config/start.sh"]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -t 'healthcheck' -m 'ok' -q 1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Piper 本地神经 TTS 服务器（Wyoming 协议）
  # 文本不出内网，合成后返回 16kHz mono WAV
  # 语音模型默认 zh_CN-huayan-medium（中文），首次启动自动从 HuggingFace 下载
  piper:
    image: linuxserver/piper:2.4.2
    container_name: envmon-tts
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
      - PIPER_VOICE=${TTS_VOICE:-zh_CN-huayan-medium}
      - LOCAL_ONLY=true
      # 国内镜像加速 HuggingFace 模型下载（首次约100-200MB）
      - HF_ENDPOINT=https://hf-mirror.com
    volumes:
      - ./piper-config:/config
    expose:
      - "10200"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout(3); s.connect(('localhost',10200)); s.close()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  backend:
    build: .
    container_name: envmon-backend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-12090}:12090"
    environment:
      - DB_PATH=/data/envmon.db
      - SCHEMA_FILE=/app/schema.sql
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_USER=${MQTT_USER:-envmon}
      - MQTT_PASS=${MQTT_PASS:-envmon}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-admin123}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-168}
      - RAW_RETENTION_DAYS=${RAW_RETENTION_DAYS:-7}
      - MINUTE_RETENTION_DAYS=${MINUTE_RETENTION_DAYS:-400}
      # Piper TTS 服务器地址（Wyoming 协议）
      - TTS_HOST=piper
      - TTS_PORT=10200
      - TTS_VOICE=${TTS_VOICE:-zh_CN-huayan-medium}
      # 语音播报开关（1=开启报警自动语音，0=关闭）
      - TTS_ENABLED=${TTS_ENABLED:-1}
    volumes:
      - ./data:/data
    depends_on:
      mosquitto:
        condition: service_healthy
      piper:
        condition: service_healthy

  # 局域网设备自动发现应答器（UDP 多播）
  # 设备端在 LAN 模式下广播 "ENVMON?" 到 239.255.1.1:12091，
  # 本服务回复 {"ip":<本机LAN IP>,"port":18830,"user":...,"pass":...}，
  # 设备据此自动保存配置并重启，无需手动填服务器地址。
  # 采用 network_mode: host，直接监听宿主机网卡并发送多播。
  discovery:
    build: .
    container_name: envmon-discovery
    restart: unless-stopped
    network_mode: host
    command: python /app/scripts/envmon-discovery.py
    environment:
      - DISC_MCAST=239.255.1.1
      - DISC_PORT=12091
      - DISC_REQ=ENVMON?
      # 设备接入地址 = 宿主机对外 MQTT 端口（与 ports 映射一致）
      - MQTT_PORT=${MQTT_PORT:-18830}
      - MQTT_USER=${MQTT_USER:-envmon}
      - MQTT_PASS=${MQTT_PASS:-envmon}
      # 显式指定监听/发送的多播网卡，避免多网卡（含 Docker 网桥）环境下
      # 默认多播路由选到 docker0 内部地址；回复给设备的 IP 也取该网卡地址。
      # 如换机器/换网卡，在 .env 里改 DISC_IFACE=你的网卡名，或用 DISC_IP 强制回复 IP。
      - DISC_IFACE=${DISC_IFACE:-}
    depends_on:
      - mosquitto
