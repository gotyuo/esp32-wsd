# ============================================================
# 物联网环境监测系统 - Docker Compose 部署
#
# 非常规端口设计（降低扫描风险）:
#   MQTT 对外 18830（设备接入）
#   Web  对外 12090 （管理仪表盘/API）
#   TTS  对内 10200（Piper 本地语音合成，不对外暴露）
# 可通过 .env 文件覆盖: MQTT_PORT / WEB_PORT / MQTT_USER / MQTT_PASS / ADMIN_TOKEN
# ============================================================
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: envmon-broker
    restart: unless-stopped
    user: root
    ports:
      - "${MQTT_PORT:-18830}:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
    environment:
      - MQTT_USER=${MQTT_USER:-envmon}
      - MQTT_PASS=${MQTT_PASS:-envmon}
    entrypoint: ["/bin/sh", "/mosquitto/config/start.sh"]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -t 'healthcheck' -m 'ok' -q 1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Piper 本地神经 TTS 服务器（Wyoming 协议）
  # 文本不出内网，合成后返回 16kHz mono WAV
  # 语音模型默认 zh_CN-huayan-medium（中文），首次启动自动从 HuggingFace 下载
  piper:
    image: linuxserver/piper:2.4.2
    container_name: envmon-tts
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
      - PIPER_VOICE=${TTS_VOICE:-zh_CN-huayan-medium}
      - LOCAL_ONLY=true
      # 国内镜像加速 HuggingFace 模型下载（首次约100-200MB）
      - HF_ENDPOINT=https://hf-mirror.com
    volumes:
      - ./piper-config:/config
    expose:
      - "10200"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout(3); s.connect(('localhost',10200)); s.close()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  backend:
    build: .
    container_name: envmon-backend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-12090}:12090"
    environment:
      - DB_PATH=/data/envmon.db
      - SCHEMA_FILE=/app/schema.sql
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_USER=${MQTT_USER:-envmon}
      - MQTT_PASS=${MQTT_PASS:-envmon}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-admin123}
      - ADMIN_RESET=${ADMIN_RESET:-}
      - SESSION_TTL_HOURS=${SESSION_TTL_HOURS:-168}
      - RAW_RETENTION_DAYS=${RAW_RETENTION_DAYS:-2}
      - MINUTE_RETENTION_DAYS=${MINUTE_RETENTION_DAYS:-400}
      # Piper TTS 服务器地址（Wyoming 协议）
      - TTS_HOST=piper
      - TTS_PORT=10200
      - TTS_VOICE=${TTS_VOICE:-zh_CN-huayan-medium}
      # 后端扫描局域网的出口 IP。默认留空 = 自动探测本机 LAN IP（推荐）。
      # 注意：不要硬编码成某台机器的内网 IP，否则换机器后扫描会去扫错误的子网、
      # 永远发现不了设备。多网卡/容器网络误判时才在 .env 里按宿主机实际内网 IP 显式指定，
      # 例如 DISC_IP=192.168.1.100。
      - DISC_IP=${DISC_IP:-}
      # 语音播报开关（1=开启报警自动语音，0=关闭）
      - TTS_ENABLED=${TTS_ENABLED:-1}
      # 设备离线判定窗口（秒）：超过该时长无遥测即判离线。默认 120s，
      # 必须大于设备上报间隔（默认 10s，阈值页可调大）。上报间隔调大时请同步调大此值。
      - OFFLINE_TIMEOUT_S=${OFFLINE_TIMEOUT_S:-120}
    volumes:
      - ./data:/data
    depends_on:
      mosquitto:
        condition: service_healthy
      piper:
        condition: service_healthy

  # 局域网设备自动发现应答器（UDP 多播）  —— envmon-discovery 20261006-v2.0
  # 设备在 LAN 模式下广播探针到 239.255.1.1:12091，本服务回复
  # {"ip":<服务器IP>,"port":18830,"user":...,"pass":...}，设备自动保存并重启。
  #
  # v2.0 起同时支持两种探针：
  #   v2.0.0 旧固件 "ENVMON?"                                （无身份）
  #   v2.1.x 新固件 {"probe":"EnvMon","pid":"clinic-a",...}  （带项目标识）
  # 并用 DISC_PROJECTS 按 pid 路由：未登记的项目一律不应答，多项目共存不串。
  #
  # 采用 network_mode: host，直接监听宿主机网卡并发送多播。
  discovery:
    build: .
    container_name: envmon-discovery
    restart: unless-stopped
    network_mode: host
    command: python /app/scripts/envmon-discovery.py
    environment:
      - DISC_MCAST=239.255.1.1
      - DISC_PORT=12091
      - DISC_REQ=ENVMON?
      # 设备接入地址 = 宿主机对外 MQTT 端口（与 ports 映射一致）
      - MQTT_PORT=${MQTT_PORT:-18830}
      - MQTT_USER=${MQTT_USER:-envmon}
      - MQTT_PASS=${MQTT_PASS:-envmon}
      # 回复给设备的「服务器 IP」。强烈建议显式设置（如 DISC_IP=172.22.22.83）：
      # 多网卡/容器环境下自动探测常选到 docker0（172.17.x），设备拿到也连不上。
      - DISC_IP=${DISC_IP:-}
      # 多项目路由表（JSON 字符串）。例：
      #   DISC_PROJECTS={"clinic-a":{"ip":"172.22.22.83","port":18830,"user":"envmon","pass":"envmon"}}
      # 未登记的 pid 一律不应答；key 支持 `前缀*` 通配。留空 = 所有 pid 都用默认配置应答。
      - DISC_PROJECTS=${DISC_PROJECTS:-}
      # 是否应答旧固件的裸探针 "ENVMON?"。多项目共存时建议设 0，
      # 否则未登记设备也会被本服务器认领，导致项目串。
      - DISC_ALLOW_LEGACY=${DISC_ALLOW_LEGACY:-1}
      # 显式指定监听/发送的多播网卡，避免多网卡（含 Docker 网桥）环境下
      # 默认多播路由选到 docker0 内部地址。
      # 如换机器/换网卡，在 .env 里改 DISC_IFACE=你的网卡名。
      - DISC_IFACE=${DISC_IFACE:-}
    depends_on:
      - mosquitto
