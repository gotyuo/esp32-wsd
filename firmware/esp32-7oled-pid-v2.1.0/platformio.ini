[platformio]
disable_auto_sync = true
telemetry = disabled

[env:esp32-7oled]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/ttyACM0
build_flags =
    -DARDUINO_USB_MODE=0
    ; v2.1.0: 打开 USB CDC，应用模式下 USB 口可直接看串口日志（v2.0.0 为 0，导致 COM 口无输出）
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
    ; v2.1.0: 版本号用于上报 fw 字段与屏显，回退时据此辨认
    -DFW_VERSION=\"2.1.1\"
    ; 项目标识（多项目共存关键）：每个项目改成自己的 pid，例如 clinic-a
    -DPROJECT_ID=\"default\"
    ; Web 服务端口：避开 80 冲突
    -D WEB_PORT=8822
partition_table = partitions_ota.csv
monitor_filters = esp32_exception_decoder
