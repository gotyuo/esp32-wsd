; ============================================================
; ESP8266 TFT (ST7735) firmware — v1.3.0 release
; Standalone build (copy of src_esp8266_tft/ at v1.3.0)
; ============================================================

[env:esp8266-tft]
platform = espressif8266 @ 4.2.0
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyUSB0
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DFW_VERSION=\"1.3.0\"
    -DESP8266_BUILD
monitor_filters = esp8266_exception_decoder
lib_deps =
    ESP8266WebServer
    ESP8266WiFi
    EEPROM
    DNSServer
