; ============================================================
; 物联网环境监测系统 - 固件
; 支持两种设备:
;   1. ESP32-S3 DevKitC (env:esp32-s3)  — 全功能: 传感器+屏幕+体征+OTA
;   2. ESP8266 ESP-12F   (env:esp8266)   — 精简: 传感器+报警，无屏幕无体征
;
; 编译 ESP32:  pio run -e esp32-s3
; 烧录 ESP32:  pio run -e esp32-s3 -t upload --upload-port /dev/ttyACM0
; 编译 ESP32-OLED(4孔 I2C 屏):  pio run -e esp32-s3-oled
; 编译 ESP8266: pio run -e esp8266
; 烧录 ESP8266: pio run -e esp8266 -t upload --upload-port /dev/ttyUSB0
; ============================================================

; ---------- ESP32-S3 环境 ----------
[env:esp32-s3]
platform = espressif32 @ 6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/ttyACM0
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
    -DFW_VERSION=\"1.7.0\"
partition_table = partitions_ota.csv
monitor_filters = esp8266_exception_decoder

; ---------- ESP32-S3 OLED 变体（4 孔 I2C 屏，走独立 I2C1）----------
; 屏幕：0.96" I2C OLED (SSD1306/SSD1315)
; 接线：VDD->3V3, VSS->GND, SCL->GPIO13, SDA->GPIO14
; 与传感器 I2C0(GPIO8/9)完全分离；LED/蜂鸣/麦克风/喇叭沿用主版 pins 分配。
[env:esp32-s3-oled]
platform = espressif32 @ 6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/ttyACM0
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
    -DFW_VERSION=\"1.7.0\"
partition_table = partitions_ota.csv
monitor_filters = esp32_exception_decoder
build_src_filter = -<*> +<../src_esp32s3_oled/>

; ---------- ESP8266 环境 ----------
[env:esp8266]
platform = espressif8266 @ 4.2.0
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyUSB0
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DFW_VERSION=\"1.0.0\"
    -DESP8266_BUILD
monitor_filters = esp8266_exception_decoder
build_src_filter = -<*> +<../src_esp8266/>
lib_deps =
    ESP8266WebServer
    ESP8266WiFi
    EEPROM
    DNSServer
    U8g2

; ---------- ESP8266 6 线 SPI TFT 变体 ----------
; 屏幕：0.96" SPI TFT (ST7735S) 160x80, 软件 SPI
; 接线: VSS->GND, VDD->3V3, CS->D0, DC->D1,
;       MOSI->D4, SCK->D2, BL->D5, RST->悬空
;       传感器 SDA->D6, SCL->D7
[env:esp8266-tft]
platform = espressif8266 @ 4.2.0
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyUSB0
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DFW_VERSION=\"1.0.1\"
    -DESP8266_BUILD
monitor_filters = esp8266_exception_decoder
build_src_filter = -<*> +<../src_esp8266_tft/>
lib_deps =
    ESP8266WebServer
    ESP8266WiFi
    EEPROM
    DNSServer
