; ============================================================
; 物联网环境监测系统 - 固件
; 4 个目标平台，按芯片 + 屏幕类型命名:
;   esp32-4oled   ESP32-S3 + 4针 I2C OLED (SSD1306)
;   esp32-6oled   ESP32-S3 + 6线 SPI TFT (ST7735) 全功能
;   esp8266-4oled ESP8266 + 4针 I2C OLED (SSD1306)
;   esp8266-6oled ESP82662 + 6线 SPI TFT (ST7735)
;
; ============================================================

[platformio]
; 节头置于首行，满足 PlatformIO 解析要求（INIs 不允许 [env] 之前无节头）
disable_auto_sync = true
telemetry = disabled

; ---------- ESP32-S3 + 4针 I2C OLED (SSD1306) ----------
; 接线: VDD->3V3, VSS->GND, SCL->GPIO13, SDA->GPIO14
; 传感器 I2C0(GPIO8/9) 与屏幕独立
[env:esp32-4oled]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/ttyACM0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
    -DFW_VERSION=\"2.0.2\"
partition_table = partitions_ota.csv
monitor_filters = esp32_exception_decoder
build_src_filter = -<*> +<../src_esp32_4oled/>

; ---------- ESP32-S3 + 6线 SPI TFT (ST7735) 全功能 ----------
; 接线: SCK->GPIO12, MOSI->GPIO11, CS->GPIO10, DC->GPIO7, RST->GPIO6, BL->GPIO5
; 传感器+体征+OTA+AD6针屏
[env:esp32-6oled]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/ttyACM0
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
    -DFW_VERSION=\"2.0.0\"
partition_table = partitions_ota.csv
monitor_filters = esp32_exception_decoder

; ---------- ESP8266 + 4针 I2C OLED (SSD1306) ----------
; 接线: VDD->3V3, VSS->GND, SCL->D5(GPIO14), SDA->D6(GPIO12)
; 传感器 AHT20+BMP280+MAX30102 共用另一组 I2C: SCL=D8(GPIO15), SDA=D7(GPIO13)
[env:esp8266-4oled]
platform = espressif8266 @ 4.2.0
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyUSB0
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DESP8266_BUILD
    -DFW_VERSION=\"2.0.2\"
monitor_filters = esp8266_exception_decoder
build_src_filter = -<*> +<../src_esp8266_4oled/>
lib_deps =
    ESP8266WebServer
    ESP8266WiFi
    EEPROM
    DNSServer
    U8g2
    Wire

; ---------- ESP8266 + 6线 SPI TFT (ST7735) ----------
; 接线: SCK/MOSI/CS/DC/RST/BL 6线 SPI 接 ST7735 彩色屏
[env:esp8266-6oled]
platform = espressif8266 @ 4.2.0
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyUSB0
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DESP8266_BUILD
    -DFW_VERSION=\"2.0.0\"
monitor_filters = esp8266_exception_decoder
build_src_filter = -<*> +<../src_esp8266_6oled/>
lib_deps =
    ESP8266WebServer
    ESP8266WiFi
    EEPROM
    DNSServer
    U8g2
    Wire
