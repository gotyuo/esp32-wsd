; ============================================================
; 物联网环境监测系统 - ESP32-S3 固件
; 硬件: ESP32-S3 DevKitC-1 + AHT20 + BMP280 + GC9109 0.96" TFT
;       + 裸驻极体麦克风(ADC,需4.7kΩ偏置) + 无源喇叭
;       + 共阴 RGB LED + 无源蜂鸣器
;
; 零第三方库设计：所有传感器/屏幕/MQTT 驱动均为内置实现，
; 离线环境也能直接编译，无需从注册表下载依赖。
; 一对一接线表见 docs/01-硬件接线.md 与 src/pins.h 注释
; ============================================================
[env:esp32-s3-devkitc-1]
platform = espressif32 @ 6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; 若烧录时设备枚举的串口变化，请修改下行（本机当前为 COM6）
upload_port = /dev/ttyACM0
; CH340 适配器(1a86:55d3)连在 UART0，不是 USB-CDC。
; 禁用板定义里的 ARDUINO_USB_MODE=1，把 Serial 切回 UART0。
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
    -DFW_VERSION=\"1.7.0\"
partition_table = partitions_ota.csv
monitor_filters = esp32_exception_decoder
