; ============================================================
; 物联网环境监测系统 - 固件
; 支持两种设备:
;   1. ESP32-S3 DevKitC (env:esp32-s3)  — 全功能: 传感器+屏幕+体征+OTA
;   2. ESP8266 ESP-12F   (env:esp8266)   — 精简: 传感器+报警，无屏幕无体征
;
; 编译 ESP32:  pio run -e esp32-s3
; 烧录 ESP32:  pio run -e esp32-s3 -t upload --upload-port /dev/ttyACM0
; 编译 ESP32-OLED(4孔 I2C 屏):  pio run -e esp32-s3-oled
; 编译 ESP8266: pio run -e esp8266
; 烧录 ESP8266: pio run -e esp8266 -t upload --upload-port /dev/ttyUSB0
; ============================================================

; ---------- ESP32-S3 环境 ----------
[env:esp32-s3]
platform = espressif32 @ 6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/ttyACM0
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
    -DFW_VERSION=\"1.7.0\"
partition_table = partitions_ota.csv
monitor_filters = esp8266_exception_decoder

; ---------- ESP32-S3 OLED 变体（4 孔 I2C 屏，走独立 I2C1）----------
; 屏幕：0.96" I2C OLED (SSD1306/SSD1315)
; 接线：VDD->3V3, VSS->GND, SCL->GPIO13, SDA->GPIO14
; 与传感器 I2C0(GPIO8/9)完全分离；LED/蜂鸣/麦克风/喇叭沿用主版 pins 分配。
[env:esp32-s3-oled]
platform = espressif32 @ 6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/ttyACM0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
    -DFW_VERSION=\"1.7.0\"
partition_table = partitions_ota.csv
monitor_filters = esp32_exception_decoder
build_src_filter = -<*> +<../src_esp32s3_oled/>

; ---------- ESP32-S3 ST7735 TFT LCD 变体（6 线 SPI 彩色屏）----------
; 屏幕：0.96" SPI TFT (ST7735 IPS) 160x80，软件 SPI
; 接线：SCK->GPIO12, MOSI->GPIO11, CS->GPIO10, DC->GPIO7, RST->GPIO6, BL->GPIO5
; 传感器 I2C0(GPIO8/9) 与屏完全独立；LED/蜂鸣/麦克风/喇叭沿用主版 pins 分配。
[env:esp32-s3-tft7735]
platform = espressif32 @ 6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/ttyACM0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
    -DFW_VERSION=\"1.0.0\"
partition_table = partitions_ota.csv
monitor_filters = esp32_exception_decoder
build_src_filter = -<*> +<../src_esp32s3_tft7735/>

; ---------- ESP8266 环境 ----------
[env:esp8266]
platform = espressif8266 @ 4.2.0
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyUSB0
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DFW_VERSION=\"1.0.0\"
    -DESP8266_BUILD
monitor_filters = esp8266_exception_decoder
build_src_filter = -<*> +<../src_esp8266/>
lib_deps =
    ESP8266WebServer
    ESP8266WiFi
    EEPROM
    DNSServer
    U8g2

; ---------- ESP8266 I2C OLED 变体 (v2.0.0) ----------
; 屏幕：0.96" I2C OLED (SSD1306) 128x64, 4引脚
; 接线: VDD->3V3, VSS->GND, SCL->D1(GPIO5), SDA->D2(GPIO4)
;       传感器 SDA->D7(GPIO13), SCL->D6(GPIO12)
; ---------- ESP8266 OLED 变体 (v3.0) ----------
; OLED: SCL=D5(GPIO14) SDA=D4(GPIO2) u8g2 软件 I2C
; 传感器: SCL=D6(GPIO12) SDA=D7(GPIO13) Wire 硬件 I2C
; 无 MAX30102，无 BOOT 键检查
[env:esp8266-v3]
platform = espressif8266 @ 4.2.0
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyUSB0
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DESP8266_BUILD
    -DFW_VERSION=\"3.0.0\"
monitor_filters = esp8266_exception_decoder
build_src_filter = -<*> +<../src_esp8266_v3/>
lib_deps =
    ESP8266WebServer
    ESP8266WiFi
    EEPROM
    DNSServer
    U8g2
    Wire

