; ============================================================
; 物联网环境监测系统 - ESP8266 固件
; 硬件: ESP-12F (ESP8266) + AHT20 + BMP280 + 报警 LED/蜂鸣器
;       (无屏幕, 无体征 ADC, 纯环境监测终端)
;
; 与 ESP32-S3 版共用同一 MQTT 服务器，数据格式完全一致。
; 编译: pio run -e esp8266
; 烧录: pio run -e esp8266 -t upload --upload-port /dev/ttyUSB0
; ============================================================
[env:esp8266]
platform = espressif8266 @ 4.2.0
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyUSB0
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DFW_VERSION=\"1.0.0\"
    -DESP8266_BUILD
    -Isrc
    ; 复用 ESP32 的 5x7 字体源(ESP8266 build 排除了 src/,需显式加 include 路径)
monitor_filters = esp8266_exception_decoder
lib_deps =
    ESP8266WebServer
    ESP8266WiFi
    EEPROM
